<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e1b4b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#grad1)"/>
  
  <!-- Document Shape -->
  <g filter="url(#shadow)">
    <path d="M140 100 H310 L372 162 V412 H140 Z" fill="#ffffff" rx="16"/>
    <!-- Folded corner -->
    <path d="M310 100 V162 H372 Z" fill="#cbd5e1"/>
    
    <!-- CV Content Lines -->
    <!-- Name / Header placeholder -->
    <rect x="175" y="145" width="115" height="14" rx="7" fill="#1e40af"/>
    <rect x="175" y="170" width="80" height="8" rx="4" fill="#94a3b8"/>
    
    <!-- Divider -->
    <line x1="175" y1="195" x2="337" y2="195" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Section 1 -->
    <rect x="175" y="215" width="70" height="10" rx="5" fill="#3b82f6"/>
    <rect x="175" y="235" width="150" height="7" rx="3.5" fill="#64748b"/>
    <rect x="175" y="250" width="135" height="7" rx="3.5" fill="#94a3b8"/>
    <rect x="175" y="265" width="145" height="7" rx="3.5" fill="#94a3b8"/>
    
    <!-- Section 2 -->
    <rect x="175" y="290" width="65" height="10" rx="5" fill="#3b82f6"/>
    <rect x="175" y="310" width="150" height="7" rx="3.5" fill="#64748b"/>
    <rect x="175" y="325" width="125" height="7" rx="3.5" fill="#94a3b8"/>
    <rect x="175" y="340" width="140" height="7" rx="3.5" fill="#94a3b8"/>
    
    <!-- ATS Verified Badge (Green Checkmark) -->
    <circle cx="340" cy="380" r="44" fill="url(#emeraldGrad)"/>
    <path d="M322 380 L334 392 L360 366" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
